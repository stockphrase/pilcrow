[package]
name = "pilcrow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pilcrow"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
glib = "0.20"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
